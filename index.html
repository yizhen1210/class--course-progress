<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>班級課程進度</title>

    <!-- PWA / 桌面圖示 -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
    <meta name="theme-color" content="#7a6c96">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Iansui&display=swap" rel="stylesheet">

    <style>
        /* ---- 全站與基礎設定規範 ---- */
        :root {
            --bg: #ece8f0;
            --surface: #ffffff;
            --text: #372f40;
            --muted: #948c9e;
            --accent-rgb: 122,108,150;
            --accent: rgb(var(--accent-rgb));
            --focus-glow: color-mix(in srgb, var(--accent) 50%, transparent);
            --accent-dark: color-mix(in srgb, var(--accent) 82%, #000);
            --line: #d9d0e0;
            --danger: #a85b6b;
            --holiday: #c0392b;
            --exam: #2f7fd1;
            --fs-h2: 18.5px;
            --fs-body: 15px;
        }
        * { box-sizing: border-box; }
        button, input, select, textarea { font-family: inherit; }
        body {
            font-family: 'Iansui', system-ui, sans-serif;
            font-size: 18px;
            margin: 0; min-height: 100vh;
            background: var(--bg); color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        body:not(.ready) [data-gated] { visibility: hidden; }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: var(--surface); border: 3px solid var(--line); padding: 36px 44px; border-radius: 20px; text-align: center; box-shadow: 0 20px 55px rgba(0,0,0,0.4); width: min(520px, 90vw); }
        .modal-title { font-size: 1.4em; margin: 0 0 22px; }
        .modal-input { display: block; width: 100%; margin: 0 0 24px; padding: 12px 18px; border: 2px solid var(--line); border-radius: 14px; font-family: inherit; font-size: 1.1em; outline: none; text-align: center; background: var(--surface); color: var(--text); }
        .modal-input::placeholder { color: var(--muted); }
        .modal-input:focus { border-color: var(--accent); box-shadow: 0 0 12px 3px var(--focus-glow); }
        .modal-hint { display: none; margin: -14px 0 18px; font-size: 0.9em; color: var(--danger); }
        .modal-actions { display: flex; justify-content: center; gap: 18px; }
        .modal-actions button { padding: 11px 38px; border-radius: 50px; cursor: pointer; font-family: inherit; font-size: 1.15em; border: 2px solid var(--accent); }
        .btn-ok { background: var(--accent); color: #fff; }
        .btn-ok:hover { background: var(--accent-dark); }
        .btn-cancel { background: #f2f8f9; color: var(--accent); }
        .btn-cancel:hover { background: var(--accent); color: #fff; }
        @media (max-width: 640px) {
            .modal-content { padding: 26px 22px; width: min(420px, 88vw); }
            .modal-title { white-space: nowrap; }
        }

        .btn { padding: 9px 22px; border-radius: 50px; border: 2px solid var(--accent); background: var(--accent); color: #fff; font-family: inherit; font-size: 1em; cursor: pointer; }
        .btn.outline { background: transparent; color: var(--accent); }
        .btn.outline:hover { background: var(--accent); color: #fff; }

        /* ---- 所有按鈕點擊時縮放壓感特效 ---- */
        button:active, .btn:active, button.icon-btn:active, nav.tabs button:active, .chip:active {
            transform: scale(0.97);
            transition: transform 0.1s ease;
        }

        .admin-only.hidden { display: none; }
        body.is-admin #loginBtn { display: none; }
        body.is-admin #content { display: none; }

        /* =========================================================
           頂部 Header 標準網格佈局與樣式規範
           ========================================================= */
        header { 
            display: grid; 
            grid-template-columns: 1fr auto 1fr; 
            align-items: center; 
            gap: 8px; 
            max-width: 1100px; 
            margin: 0 auto 24px;
            border-bottom: 2px solid var(--accent); 
            padding: 30px 20px;
        }

        .header-title { 
            grid-column: 2; 
            justify-self: center; 
            text-align: center; 
        }

        .header-actions { 
            grid-column: 3; 
            justify-self: end; 
            display: flex; 
            align-items: center; 
        }

        header h1 { 
            font-size: 2em; 
            margin: 0; 
            white-space: nowrap; 
            line-height: 1.3; 
        }

        #loginBtn, #logoutBtn {
            background: transparent;
            padding: 9px 22px;
            border-radius: 50px;
            font-family: inherit;
            font-size: 1.05em;
            white-space: nowrap;
            transition: all 0.2s;
            cursor: pointer;
        }

        #loginBtn { 
            color: var(--accent); 
            border: 2px solid var(--accent); 
        }
        #loginBtn:hover { 
            background: var(--accent); 
            color: #fff; 
        }

        #logoutBtn { 
            color: var(--holiday); 
            border: 2px solid var(--holiday); 
        }
        #logoutBtn:hover { 
            background: var(--holiday); 
            color: #fff; 
        }

        #wrap { width: 85%; max-width: 1100px; margin: 0 auto; padding: 0 24px 60px; }
        .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 1px 0 rgba(0,0,0,.04); }
        .section { padding: 18px 20px; margin: 16px 0; }
        .hint { font-size: 14.5px; color: var(--muted); line-height: 1.7; }
        .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .field { display: flex; flex-direction: column; gap: 4px; }
        .field label { font-size: 14px; color: var(--muted); font-weight: 600; }
        input[type=text], input[type=date], textarea, select {
            font-family: inherit; font-size: 16px; color: var(--text);
            background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px;
        }
        input[type=text]:focus, input[type=date]:focus, textarea:focus {
            outline: none; border-color: var(--accent); box-shadow: 0 0 10px 2px var(--focus-glow);
        }
        textarea { resize: vertical; font-family: inherit; width: 100%; }
        .btn.small { padding: 5px 12px; font-size: 14.5px; }
        .btn.danger { background: var(--danger); border-color: var(--danger); }
        button.icon-btn { background: none; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; padding: 5px 9px; font-size: 15px; color: var(--text); }
        button.icon-btn:hover:not(:disabled) { background: var(--accent); color: #fff; border-color: var(--accent); }
        button.icon-btn:disabled { opacity: .4; cursor: default; }
        .empty { text-align: center; padding: 40px 20px; color: var(--muted); }

        nav.tabs { display: flex; gap: 4px; margin: 14px 0 6px; border-bottom: 2px solid var(--line); flex-wrap: wrap; }
        nav.tabs button { font-family: inherit; font-weight: 700; font-size: 16.5px; background: none; border: none; cursor: pointer; color: var(--muted); padding: 9px 14px 11px; position: relative; white-space: nowrap; }
        nav.tabs button.active { color: var(--text); }
        nav.tabs button.active::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -2px; height: 3px; background: var(--accent); border-radius: 2px 2px 0 0; }

        .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
        .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-size: 15.5px; font-weight: 700; cursor: pointer; border: 2px solid transparent; background: var(--bg); }
        .chip .dot { width: 8px; height: 8px; border-radius: 50%; }
        .chip.active { border-color: currentColor; background: #fff; }

        .subj-row { display: grid; grid-template-columns: 22px 200px 1fr; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); }
        .subj-row > .row { justify-content: flex-end; }
        .subj-row:last-child { border-bottom: none; }
        .wd-toggles { display: flex; gap: 4px; }
        .wd-legend { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; margin: 4px 0 8px; }
        .wd-legend-items { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 5px; }
        .date-name-row { display: flex; gap: 6px; align-items: center; }
        .wd-toggles button { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--line); background: #fff; font-size: 14.5px; cursor: pointer; color: var(--muted); font-weight: 700; }
        .wd-toggles button.on { background: var(--text); color: #fff; border-color: var(--text); }
        .wd-toggles button.hw { background: var(--accent); color: #fff; border-color: var(--accent); }
        .swatch { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); cursor: pointer; }

        .month-head { font-weight: 700; font-size: 17px; margin: 16px 0 6px; }
        .month-head:first-child { margin-top: 0; }
        .entry-row { display: grid; grid-template-columns: 78px 1fr 1fr; gap: 10px; align-items: start; padding: 8px 6px; border-radius: 8px; }
        .entry-row.holiday { background: color-mix(in srgb, var(--holiday) 10%, white); }
        .entry-row + .entry-row { border-top: 1px solid var(--bg); }
        .date-lbl { font-weight: 700; font-size: 15px; padding-top: 8px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
        .date-lbl .wd { font-weight: 500; color: var(--muted); font-size: 13px; }
        .stamp { display: inline-block; align-self: flex-start; font-size: 11.5px; font-weight: 700; color: var(--holiday); border: 1.5px solid var(--holiday); border-radius: 5px; padding: 1px 6px; transform: rotate(-6deg); width: fit-content; max-width: fit-content; white-space: pre-line; text-align: center; line-height: 1.25; }
        .stamp.exam { color: var(--exam); border-color: var(--exam); transform: rotate(4deg); }
        .entry-row.exam { background: color-mix(in srgb, var(--exam) 10%, white); }
        .entry-row textarea { min-height: 34px; }

        .week-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 10px; flex-wrap: wrap; }
        .week-range { display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; column-gap: 6px; font-weight: 700; font-size: 18.5px; }
        .week-grid { display: grid; grid-template-columns: repeat(5,1fr); gap: 10px; }
        .week-sync-row { text-align: center; margin: -6px 0 10px; }
        .week-sync-row .saved-flag { margin-left: 0; }
        @media (max-width: 820px) { .week-grid { grid-template-columns: 1fr; } }

        /* ---- 手機版響應式自適應設定 ---- */
        @media (max-width: 680px) {
            header {
                padding: 20px 14px;
                margin-bottom: 18px;
            }
            header h1 { 
                font-size: 1.5em; 
            }
            #loginBtn, #logoutBtn {
                padding: 6px 13px;
                font-size: 0.84em;
            }
            #wrap { width: 100%; padding: 0 12px 40px; }
            .section { padding: 14px 14px; margin: 12px 0; }
            input[type=text], input[type=date], textarea, select { font-size: 16px; }
            .entry-row { grid-template-columns: 1fr; gap: 6px; }
            .date-lbl { flex-direction: row; align-items: center; gap: 8px; padding-top: 0; }
            .subj-row .row { justify-content: space-between; }
            .config-top-row .field-term { flex: 1 1 100%; }
            .config-top-row .field-date { flex: 1 1 45%; }
            .wd-legend-label { display: block; width: 100%; margin-bottom: 2px; }
            .subj-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
            .subj-row input[data-role=name] { flex: 1 1 90px; min-width: 70px; width: auto; }
            .subj-row .swatch { flex: 0 0 auto; }
            .subj-row > .row { flex: 1 1 auto; justify-content: flex-end; gap: 4px; }
            .date-name-row { display: flex; gap: 6px; flex: 1 1 220px; min-width: 0; }
            .date-name-row input[type=date] { flex: 0 0 auto; }
            .date-name-row input[type=text] { flex: 1; min-width: 0; }
            .hw-day-head { flex-direction: column; align-items: flex-start; }
            .day-head { justify-content: center; gap: 6px; text-align: center; }
            .day-head .d { font-size: 18px; }
            .day-head .w { font-size: 18px; }
            .week-nav { flex-direction: row; flex-wrap: nowrap; align-items: center; justify-content: space-between; gap: 4px; text-align: center; }
            .week-sync-row { margin: 0 0 2px; line-height: 1; }
            .week-sync-row .saved-flag { font-size: 10px; line-height: 1; }
            .week-nav .icon-btn { font-size: 14px; padding: 5px 10px; flex: 0 0 auto; white-space: nowrap; }
            .week-nav .week-range { font-size: 14px; flex: 1 1 auto; min-width: 0; white-space: normal; justify-content: center; text-align: center; }
            nav.tabs button { padding: 8px 10px 10px; font-size: 15px; }
        }

        @media (min-width: 681px) {
            :root { --fs-h2: 20px; --fs-body: 16.5px; }
            .hint { font-size: 15.5px; }
            .field label { font-size: 15px; }
            .btn.small { font-size: 15.5px; }
            button.icon-btn { font-size: 16px; }
            nav.tabs button { font-size: 17.5px; }
            .chip { font-size: 16.5px; }
            .wd-toggles button { font-size: 15.5px; }
            .month-head { font-size: 18px; }
            .date-lbl { font-size: 16px; }
            .date-lbl .wd { font-size: 14px; }
            .week-range { font-size: 20px; }
            .day-head .d { font-size: 17px; }
            .day-head .w { font-size: 17px; }
            .subj-card .sname { font-size: 14px; }
            .subj-card textarea { font-size: 16px; }
            .day-empty { font-size: 15px; }
            .hw-day-head .d { font-size: 19.5px; }
            .hw-list li { font-size: 16.5px; }
            .toggle-row { font-size: 16px; }
            .holiday-item { font-size: 16px; }
            .public-digest h2 { font-size: 21px; }
            .public-digest li { font-size: 16.5px; }
        }
        .day-col { background: var(--surface); border: 2px solid var(--line); border-radius: 10px; overflow: hidden; }
        .day-head { padding: 9px 10px; border-bottom: 2px solid var(--line); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); display: flex; justify-content: flex-start; align-items: center; gap: 6px; flex-wrap: wrap; }
        .day-head .d { font-weight: 700; font-size: 15.5px; }
        .day-head .w { font-size: 15.5px; color: var(--muted); }
        .day-body { padding: 8px; display: flex; flex-direction: column; gap: 8px; min-height: 50px; }
        .subj-card { border-radius: 8px; padding: 7px 8px; border-left: 4px solid var(--c); background: color-mix(in srgb, var(--c) 8%, white); }
        .subj-card .sname { font-size: 13px; font-weight: 700; color: var(--c); }
        .tag-hwonly { display: inline-block; align-self: flex-start; font-size: 10px; font-weight: 700; color: var(--accent); background: color-mix(in srgb, var(--accent) 15%, white); border-radius: 4px; padding: 1px 5px; width: fit-content; max-width: fit-content; }
        .subj-card textarea { width: 100%; min-height: 30px; border: none; background: transparent; padding: 2px 0; font-size: 15px; }
        .subj-card textarea:focus { outline: none; box-shadow: none; }
        .day-empty { font-size: 14px; color: var(--muted); padding: 10px 4px; }

        .hw-day { padding: 14px 16px; margin-bottom: 10px; }
        .hw-day-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 8px; }
        .hw-day-head .d { font-weight: 700; font-size: 18px; }
        .hw-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
        .hw-list li { font-size: 15.5px; padding-left: 14px; position: relative; }
        .hw-list li::before { content: "·"; position: absolute; left: 2px; font-weight: 900; }
        .toggle-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; font-size: 15px; color: var(--muted); }
        .holiday-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
        .holiday-item { display: flex; gap: 8px; align-items: center; font-size: 15px; background: var(--bg); border-radius: 8px; padding: 6px 9px; }
        .holiday-item .lbl { flex: 1; }
        .saved-flag { font-size: 12.5px; color: var(--muted); margin-left: 6px; opacity: 0; transition: opacity .3s; }
        .saved-flag.show { opacity: 1; }
        .public-digest h2 { font-size: 19.5px; margin: 0 0 4px; }
        .public-digest ul { margin: 6px 0 0; padding-left: 18px; }
        .public-digest li { font-size: 15.5px; margin: 3px 0; }
        footer.note { margin-top: 24px; font-size: 12.5px; color: var(--muted); text-align: center; }
    </style>
</head>
<body>
    <header>
        <div class="header-title" data-gated>
            <h1><span id="appTitle">班級課程進度</span></h1>
        </div>
        <div class="header-actions">
            <button id="loginBtn" class="btn outline">登入</button>
            <button id="logoutBtn" class="btn outline admin-only hidden">登出</button>
        </div>
    </header>

    <main id="content" data-gated>
    </main>

    <section id="adminArea" class="admin-only hidden">
    </section>

    <div id="inputModal" class="modal-overlay">
        <div class="modal-content">
            <p class="modal-title">請輸入密碼</p>
            <input type="password" id="passInput" class="modal-input" placeholder="密碼" autocomplete="off">
            <p id="imeHint" class="modal-hint">偵測到中文輸入法，密碼請切換為英數</p>
            <div class="modal-actions">
                <button class="btn-ok" onclick="checkPass()">確定</button>
                <button class="btn-cancel" onclick="closeModal()">取消</button>
            </div>
        </div>
    </div>

    <div id="alertModal" class="modal-overlay">
        <div class="modal-content">
            <p class="modal-title" id="alertMsg"></p>
            <div class="modal-actions">
                <button class="btn-ok" onclick="closeAlert()">確定</button>
            </div>
        </div>
    </div>

    <div id="promptModal" class="modal-overlay">
        <div class="modal-content">
            <p class="modal-title" id="promptMsg"></p>
            <input type="text" id="promptInput" class="modal-input">
            <div class="modal-actions">
                <button class="btn-cancel" id="promptNo">取消</button>
                <button class="btn-ok" id="promptOk">確定</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut,
                 signInWithEmailAndPassword,
                 GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const $ = id => document.getElementById(id);

        const firebaseConfig = {
            apiKey: "AIzaSyA1S_AmQ_DbtxWMhQSSVacFr4pzrg4nfLk",
            authDomain: "class-course-progress.firebaseapp.com",
            projectId: "class-course-progress",
            storageBucket: "class-course-progress.firebasestorage.app",
            messagingSenderId: "1079895566529",
            appId: "1:1079895566529:web:2b58b08259d16ae5f50c40"
        };
        const DOC_PATH = ["classProgress", "main"];
        const SAVE_MERGE = false;

        const LOGIN_MODE = 'A';
        const SHARED_EMAIL = "annychen1210@gmail.com";
        const ALLOWED_EMAILS = ["annychen1210@gmail.com", "annychen1210@go.edu.tw"];

        if(!firebaseConfig.apiKey || !firebaseConfig.projectId){
            document.body.innerHTML = '<div style="max-width:520px;margin:80px auto;padding:24px;font-family:sans-serif;line-height:1.7;color:#2e3a35;text-align:center">尚未填入 Firebase 設定。</div>';
            throw new Error('firebaseConfig 未設定');
        }
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const ref = doc(db, ...DOC_PATH);

        let isAdmin = false, editorReady = false, dataArrived = false, errored = false, lastData = null;
        function showLoadError(){ if(!document.getElementById('loadError')){ const d=document.createElement('div'); d.id='loadError'; d.textContent='載入失敗，請重新整理頁面'; d.style.cssText='position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--danger);color:#fff;padding:10px 18px;border-radius:10px;z-index:2000;font-size:0.95em'; document.body.appendChild(d); } }

        let readyTimer = setTimeout(markReady, 8000);
        function markReady(){ clearTimeout(readyTimer); document.body.classList.add("ready"); }

        function maybeLoadEditor(){ if(isAdmin && dataArrived && !editorReady) loadEditor(lastData); }

        function saveData(obj){ if(!isAdmin) return; setDoc(ref, obj, { merge: SAVE_MERGE }).catch(e=>console.warn(e)); }
        onSnapshot(ref, snap => {
            lastData = snap.exists() ? snap.data() : null;
            dataArrived = true;
            renderPublic(lastData, { error: errored });
            maybeLoadEditor(); markReady();
        }, err => { console.warn(err); errored = true; renderPublic(lastData, { error: true }); showLoadError(); markReady(); });

        function isAuthorized(user){
            if(!user) return false;
            if(LOGIN_MODE === 'A') return user.email === SHARED_EMAIL;
            if(LOGIN_MODE === 'B') return user.email === ALLOWED_EMAILS[0];
            if(LOGIN_MODE === 'C') return ALLOWED_EMAILS.slice(0,2).includes(user.email);
            return false;
        }
        onAuthStateChanged(auth, user => {
            isAdmin = isAuthorized(user);
            document.querySelectorAll('.admin-only').forEach(el => el.classList.toggle('hidden', !isAdmin));
            document.body.classList.toggle('is-admin', isAdmin);
            maybeLoadEditor();
        });

        window.showAlert = (msg) => { $('alertMsg').textContent = msg; $('alertModal').style.display = 'flex'; };
        window.closeAlert = () => { $('alertModal').style.display = 'none'; };

        window.askInput = (msg, def) => new Promise(res => {
            const m = $('promptModal'), inp = $('promptInput'), ok = $('promptOk'), no = $('promptNo');
            $('promptMsg').textContent = msg; inp.value = def || '';
            m.style.display = 'flex'; setTimeout(() => { inp.focus(); inp.select(); }, 50);
            const done = v => { m.style.display = 'none'; ok.onclick = null; no.onclick = null; inp.onkeydown = null; res(v); };
            ok.onclick = () => done(inp.value);
            no.onclick = () => done(null);
            inp.onkeydown = e => { if(e.key === 'Enter') done(inp.value); else if(e.key === 'Escape') done(null); };
        });

        $('loginBtn').onclick = () => {
            if(LOGIN_MODE === 'A'){ window.openLogin(); }
            else { signInWithPopup(auth, new GoogleAuthProvider()).catch(e=>window.showAlert("登入失敗")); }
        };
        $('logoutBtn').onclick = () => signOut(auth);

        window.openLogin  = () => { $('passInput').value=''; $('imeHint').style.display='none'; $('inputModal').style.display='flex'; setTimeout(()=>$('passInput').focus(),50); };
        window.closeModal = () => { $('inputModal').style.display='none'; $('passInput').value=''; $('imeHint').style.display='none'; };
        window.checkPass  = async () => {
            const pw = $('passInput').value; if(!pw){ window.showAlert('請輸入密碼'); return; }
            try { await signInWithEmailAndPassword(auth, SHARED_EMAIL, pw); window.closeModal(); }
            catch(e){ window.showAlert("密碼錯誤"); $('passInput').value=''; $('passInput').focus(); }
        };
        const checkIME = () => { $('imeHint').style.display = /[^\x00-\x7F]/.test($('passInput').value) ? 'block' : 'none'; };
        $('passInput').addEventListener('keydown', e => { if(e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) window.checkPass(); });
        $('passInput').addEventListener('compositionstart', () => { $('imeHint').style.display='block'; });
        $('passInput').addEventListener('input', e => { if(!e.isComposing) checkIME(); });
        $('passInput').addEventListener('compositionend', checkIME);

        const PALETTE = ['#e0464f','#2f7fd1','#2fa84f','#e0872e','#8b5cf6','#14958f','#c9a227','#d6499c'];
        const WD = ['日','一','二','三','四','五','六'];
        const pad = n => String(n).padStart(2,'0');
        const fmt = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
        const parseD = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
        const shortD = s => { const d=parseD(s); return (d.getMonth()+1)+'/'+d.getDate(); };
        const wdOf = s => parseD(s).getDay();
        function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
        
        function formatExamLabel(label){
            const m = String(label||'').match(/^(.*?)(期中考|期末考)$/);
            return (m && m[1]) ? (m[1] + '\n' + m[2]) : label;
        }
        function formatHolidayLabel(label){
            const s = String(label||'');
            if(s.length <= 5) return s;
            const m = s.match(/^(.*?)(放假|補假)$/);
            return (m && m[1]) ? (m[1] + '\n' + m[2]) : s;
        }

        function schoolDates(cfg){
            if(!cfg || !cfg.start || !cfg.end) return [];
            const start = parseD(cfg.start), end = parseD(cfg.end);
            const out = []; let cur = new Date(start);
            while(cur <= end){ const wd = cur.getDay(); if(wd>=1 && wd<=5) out.push(fmt(cur)); cur.setDate(cur.getDate()+1); }
            return out;
        }
        function weeksOf(dates){
            const weeks = []; let cur = [];
            dates.forEach(ds=>{ if(wdOf(ds)===1 && cur.length){ weeks.push(cur); cur=[]; } cur.push(ds); });
            if(cur.length) weeks.push(cur);
            return weeks;
        }
        function getCurrentWeekIdx(cfg){
            const dates = schoolDates(cfg);
            const weeks = weeksOf(dates);
            if(!weeks.length) return 0;
            const todayStr = fmt(new Date());
            let idx = weeks.findIndex(w => todayStr <= w[w.length-1]);
            if(idx === -1) idx = weeks.length - 1;
            return idx;
        }
        function subjectsOnDate(cfg, ds){ const wd = wdOf(ds); return (cfg.subjects||[]).filter(s=>s.weekdays.includes(wd)); }
        function subjectsForHomework(cfg, ds){
            const wd = wdOf(ds);
            return (cfg.subjects||[]).filter(s=> s.weekdays.includes(wd) || (s.hwOnly||[]).includes(wd));
        }
        function getEntry(data, ds, sid){ return (data.entries[ds] && data.entries[ds][sid]) || {progress:'', homework:''}; }

        function renderPublic(data, status){
            const el = $('content');
            if(status.error){ el.innerHTML = '<div class="empty">資料讀取失敗，請重新整理頁面。</div>'; return; }
            if(!data || !data.config){ el.innerHTML = '<div class="empty">尚未建立學期資料，請登入後在「學期設定」建立。</div>'; return; }
            const dates = schoolDates(data.config);
            const todayStr = fmt(new Date());

            const weeks = weeksOf(dates);
            let curWeek = weeks.find(w => todayStr <= w[w.length-1]);
            if(!curWeek) curWeek = weeks[weeks.length-1];

            const weekCols = (curWeek||[]).map(ds=>{
                const subs = subjectsOnDate(data.config, ds);
                const holiday = data.holidays && data.holidays[ds];
                const exam = data.exams && data.exams[ds];
                const isToday = ds === todayStr;
                const body = subs.length ? subs.map(s=>{
                    const e = getEntry(data, ds, s.id);
                    return `<div class="subj-card" style="--c:${s.color};"><div class="sname">${esc(s.name)}</div>
                        <p style="margin:2px 0 0; font-size:var(--fs-body);">${e.progress ? esc(e.progress) : '<span class="hint">（尚未填寫）</span>'}</p></div>`;
                }).join('') : '<div class="day-empty">這天沒有排課</div>';
                return `<div class="day-col" style="${isToday?'outline:2px solid var(--accent);':''}">
                    <div class="day-head"><span class="d">${shortD(ds)}</span><span class="w">週${WD[wdOf(ds)]}${holiday?` · <span style="color:var(--holiday); font-weight:700;">${esc(holiday)}</span>`:''}${exam?` · <span style="color:var(--exam); font-weight:700;">${esc(exam)}</span>`:''}</span></div>
                    <div class="day-body">${body}</div>
                </div>`;
            }).join('');

            const upcoming = dates.filter(ds => ds >= todayStr).slice(0, 5);
            const blocks = upcoming.map(ds=>{
                const subs = subjectsForHomework(data.config, ds).map(s=>({s,e:getEntry(data,ds,s.id)})).filter(x=>x.e.homework && x.e.homework.trim());
                const d = parseD(ds);
                const holiday = data.holidays && data.holidays[ds];
                return `<div style="margin:14px 0;"><b>${(d.getMonth()+1)}/${d.getDate()}（${WD[wdOf(ds)]}）${holiday?'　'+esc(holiday):''}</b>
                    ${subs.length ? '<ul>'+subs.map(x=>`<li>${esc(x.s.name)}：${esc(x.e.homework)}</li>`).join('')+'</ul>' : '<p class="hint" style="margin:4px 0 0;">（尚未填寫作業）</p>'}
                </div>`;
            }).join('');

            el.innerHTML = `<div id="wrap" class="public-digest">
                <div class="card section">
                    <h2>${esc(data.config.termName || '本學期')} · 本週課程進度</h2>
                    <p class="hint">此頁面公開唯讀，僅供快速查看；完整編輯請登入。</p>
                    <div class="week-grid" style="margin-top:10px;">${weekCols || '<p class="hint">目前沒有排定的上課日。</p>'}</div>
                </div>
                <div class="card section">
                    <h2>近期作業</h2>
                    ${blocks || '<p class="hint">目前沒有排定的上課日。</p>'}
                </div>
            </div>`;
        }

        function loadEditor(data){
            editorReady = true;
            const local = data ? JSON.parse(JSON.stringify(data)) : { config:null, entries:{}, holidays:{} };
            if(!local.entries) local.entries = {};
            if(!local.holidays) local.holidays = {};
            if(!local.exams) local.exams = {};
            let saveTimer = null;
            function persist(){ clearTimeout(saveTimer); saveTimer = setTimeout(()=>{ saveData(local); flashSaved(); }, 450); }
            function flashSaved(){ document.querySelectorAll('.saved-flag').forEach(f=>{ f.classList.add('show'); clearTimeout(f._t); f._t=setTimeout(()=>f.classList.remove('show'),1200); }); }
            function setEntry(ds, sid, field, val){ if(!local.entries[ds]) local.entries[ds]={}; if(!local.entries[ds][sid]) local.entries[ds][sid]={progress:'',homework:''}; local.entries[ds][sid][field]=val; persist(); }
            function mkSubject(name, weekdays, hwOnly){ return { id:'s'+Math.random().toString(36).slice(2,9), name, weekdays, hwOnly: hwOnly||[], color: PALETTE[Math.floor(Math.random()*PALETTE.length)] }; }
            function defaultSubjects(){
                return [ mkSubject('國語',[1,2,3,4,5]), mkSubject('數學',[1,2,3,4,5]), mkSubject('導師時間',[1]),
                         mkSubject('健康',[1]), mkSubject('彈性課',[2]), mkSubject('閱讀課',[3]), mkSubject('綜合',[4]), mkSubject('表達力',[5]) ];
            }

            let initialWeekIdx = local.config ? getCurrentWeekIdx(local.config) : 0;
            let ui = { tab:'progress', subjectId: local.config && local.config.subjects[0] && local.config.subjects[0].id, weekIdx: initialWeekIdx, hwOnlyFilled:true };
            const host = $('adminArea');

            function subjRowHtml(s, idx, total){
                const wdBtn = w=>{
                    const isClass = s.weekdays.includes(w), isHw = !isClass && (s.hwOnly||[]).includes(w);
                    const cls = isClass ? 'on' : (isHw ? 'hw' : '');
                    const title = isClass ? '上課＋作業' : isHw ? '只交作業' : '無';
                    return `<button type="button" data-role="wd" data-wd="${w}" class="${cls}" title="${title}">${WD[w]}</button>`;
                };
                return `<div class="subj-row" data-sid="${s.id}">
                    <div class="swatch" data-role="swatch" style="background:${s.color};" title="換顏色"></div>
                    <input type="text" data-role="name" value="${esc(s.name)}" placeholder="科目名稱">
                    <div class="row" style="gap:6px;">
                        <div class="wd-toggles">${[1,2,3,4,5].map(wdBtn).join('')}</div>
                        <button type="button" class="icon-btn" data-role="up" title="上移" ${idx===0?'disabled':''}>▲</button>
                        <button type="button" class="icon-btn" data-role="down" title="下移" ${idx===total-1?'disabled':''}>▼</button>
                        <button type="button" class="icon-btn" data-role="del-subj" title="刪除科目">✕</button>
                    </div>
                </div>`;
            }
            function renderSubjList(editor, subjects){
                editor.innerHTML = subjects.map((s,i)=>subjRowHtml(s, i, subjects.length)).join('');
                wireSubjEditor(editor, subjects);
            }
            function wireSubjEditor(editor, subjects){
                editor.querySelectorAll('.subj-row').forEach(row=>{
                    const sid = row.dataset.sid, s = subjects.find(x=>x.id===sid);
                    row.querySelector('[data-role=name]').oninput = e=> s.name = e.target.value;
                    if(!s.hwOnly) s.hwOnly = [];
                    row.querySelectorAll('[data-role=wd]').forEach(btn=>{
                        btn.onclick = ()=>{
                            const w = Number(btn.dataset.wd);
                            const isClass = s.weekdays.includes(w), isHw = !isClass && s.hwOnly.includes(w);
                            const cur = isClass ? 'class' : (isHw ? 'hw' : 'off');
                            const nxt = cur==='off' ? 'class' : cur==='class' ? 'hw' : 'off';
                            s.weekdays = s.weekdays.filter(x=>x!==w);
                            s.hwOnly = s.hwOnly.filter(x=>x!==w);
                            if(nxt==='class') s.weekdays.push(w);
                            if(nxt==='hw') s.hwOnly.push(w);
                            btn.className = nxt==='class' ? 'on' : nxt==='hw' ? 'hw' : '';
                        };
                    });
                    row.querySelector('[data-role=swatch]').onclick = ()=>{ const i=PALETTE.indexOf(s.color); s.color=PALETTE[(i+1)%PALETTE.length]; row.querySelector('[data-role=swatch]').style.background=s.color; };
                    const idx = subjects.findIndex(x=>x.id===sid);
                    const up = row.querySelector('[data-role=up]');
                    if(up) up.onclick = ()=>{ if(idx>0){ [subjects[idx-1],subjects[idx]]=[subjects[idx],subjects[idx-1]]; renderSubjList(editor, subjects); } };
                    const down = row.querySelector('[data-role=down]');
                    if(down) down.onclick = ()=>{ if(idx<subjects.length-1){ [subjects[idx+1],subjects[idx]]=[subjects[idx],subjects[idx-1]]; renderSubjList(editor, subjects); } };
                    const del = row.querySelector('[data-role=del-subj]');
                    if(del) del.onclick = ()=>{ const i2=subjects.findIndex(x=>x.id===sid); if(i2>-1) subjects.splice(i2,1); renderSubjList(editor, subjects); };
                });
            }
            function configFormHtml(cfg){
                return `<div class="row config-top-row" style="margin-bottom:14px;">
                    <div class="field field-term"><label>學期名稱</label><input type="text" id="f-term" placeholder="例：114學年度第2學期" value="${esc(cfg.termName||'')}"></div>
                    <div class="field field-date"><label>開學日</label><input type="date" id="f-start" value="${cfg.start||''}"></div>
                    <div class="field field-date"><label>結業日</label><input type="date" id="f-end" value="${cfg.end||''}"></div>
                </div>
                <div>
                    <label style="font-size:14px; color:var(--muted); font-weight:600;">科目與上課星期</label>
                    <p class="hint wd-legend"><span class="wd-legend-label">點星期按鈕切換：</span><span class="wd-legend-items">白＝無<span style="display:inline-flex; align-items:center; width:10px; height:10px; border-radius:3px; background:var(--text); margin-left:4px;"></span>深色＝上課＋作業<span style="display:inline-flex; align-items:center; width:10px; height:10px; border-radius:3px; background:var(--accent); margin-left:4px;"></span>紫色＝只交作業</span></p>
                    <div id="subj-editor">${cfg.subjects.map((s,i)=>subjRowHtml(s, i, cfg.subjects.length)).join('')}</div>
                    <button class="btn outline small" id="add-subj" type="button" style="margin-top:8px;">＋ 新增科目</button>
                </div>`;
            }

            function renderApp(){
                if(!local.config){ host.innerHTML = onboardingHtml(); bindOnboarding(); return; }
                if(!ui.subjectId && local.config.subjects.length) ui.subjectId = local.config.subjects[0].id;
                host.innerHTML = `<div id="wrap">
                    <nav class="tabs">
                        <button data-tab="progress" class="${ui.tab==='progress'?'active':''}">課程進度</button>
                        <button data-tab="week" class="${ui.tab==='week'?'active':''}">週進度</button>
                        <button data-tab="homework" class="${ui.tab==='homework'?'active':''}">作業安排</button>
                        <button data-tab="settings" class="${ui.tab==='settings'?'active':''}">學期設定</button>
                    </nav>
                    <div id="tab-body">${tabHtml()}</div>
                    <footer class="note">資料即時同步到 Firebase。</footer>
                </div>`;
                bindApp();
            }
            function onboardingHtml(){
                return `<div id="wrap"><div class="card section form-card">
                    <h2 style="margin-bottom:6px;">先設定這學期</h2>
                    <p class="hint">進度、週總表、作業摘要共用同一份資料。</p>
                    ${configFormHtml({termName:'', start:'', end:'', subjects: defaultSubjects()})}
                    <div class="row" style="margin-top:14px;"><button class="btn" id="save-setup">建立學期</button></div>
                </div></div>`;
            }
            function bindOnboarding(){
                const editor = document.getElementById('subj-editor');
                let subjects = defaultSubjects();
                editor.querySelectorAll('.subj-row').forEach((row,i)=> row.dataset.sid = subjects[i].id);
                wireSubjEditor(editor, subjects);
                document.getElementById('add-subj').onclick = ()=>{ subjects.push(mkSubject('新科目',[])); renderSubjList(editor, subjects); };
                document.getElementById('save-setup').onclick = ()=>{
                    const termName = document.getElementById('f-term').value.trim();
                    const start = document.getElementById('f-start').value, end = document.getElementById('f-end').value;
                    if(!start || !end){ window.showAlert('請填開學日與結業日'); return; }
                    const cleaned = subjects.filter(s=>s.name.trim() && s.weekdays.length);
                    if(!cleaned.length){ window.showAlert('至少需要一個有名稱、有勾選星期的科目'); return; }
                    local.config = { termName, start, end, subjects: cleaned };
                    ui.subjectId = cleaned[0].id;
                    ui.weekIdx = getCurrentWeekIdx(cleaned);
                    saveData(local); renderApp();
                };
            }

            function tabHtml(){
                if(!local.config.subjects.length) return '<div class="empty">還沒有科目，請到「學期設定」新增。</div>';
                if(ui.tab==='progress') return progressHtml();
                if(ui.tab==='week') return weekHtml();
                if(ui.tab==='homework') return homeworkHtml();
                if(ui.tab==='settings') return settingsHtml();
                return '';
            }
            function progressHtml(){
                const subj = local.config.subjects.find(s=>s.id===ui.subjectId) || local.config.subjects[0];
                const allSchoolDates = schoolDates(local.config);
                const normalDates = allSchoolDates.filter(ds=>subj.weekdays.includes(wdOf(ds)));
                const hwOnlyDates = allSchoolDates.filter(ds=>(subj.hwOnly||[]).includes(wdOf(ds)) && !subj.weekdays.includes(wdOf(ds)));
                const dates = [...normalDates, ...hwOnlyDates].sort();
                let lastMonth=null, rows='';
                dates.forEach(ds=>{
                    const d = parseD(ds), mLabel = d.getFullYear()+'年 '+(d.getMonth()+1)+'月';
                    if(mLabel!==lastMonth){ rows += `<div class="month-head">${mLabel}</div>`; lastMonth=mLabel; }
                    const e = getEntry(local, ds, subj.id), isHoliday = !!(local.holidays[ds]), isExam = !!(local.exams[ds]);
                    const isHwOnly = !subj.weekdays.includes(wdOf(ds));
                    rows += `<div class="entry-row ${isHoliday?'holiday':(isExam?'exam':'')}">
                        <div class="date-lbl">${shortD(ds)}<span class="wd">(${WD[wdOf(ds)]})</span>${isHoliday?`<span class="stamp">${esc(formatHolidayLabel(local.holidays[ds]))}</span>`:''}${isExam?`<span class="stamp exam">${esc(formatExamLabel(local.exams[ds]))}</span>`:''}${isHwOnly?`<span class="tag-hwonly">只作業</span>`:''}</div>
                        ${isHwOnly?'<div></div>':`<textarea data-field="progress" data-sid="${subj.id}" data-date="${ds}" placeholder="今天的進度…">${esc(e.progress)}</textarea>`}
                        <textarea data-field="homework" data-sid="${subj.id}" data-date="${ds}" placeholder="今天的作業…">${esc(e.homework)}</textarea>
                    </div>`;
                });
                return `<div class="chips">
                    ${local.config.subjects.map(s=>`<span class="chip ${s.id===subj.id?'active':''}" style="color:${s.color}" data-subj="${s.id}"><span class="dot" style="background:${s.color}"></span>${esc(s.name)}</span>`).join('')}
                    <span class="saved-flag">已同步</span>
                </div>
                <div class="card section">
                    <h2 style="font-size:var(--fs-h2);">${esc(subj.name)}</h2>
                    ${dates.length ? rows : '<p class="hint">此科目在學期範圍內沒有排定的上課日。</p>'}
                </div>`;
            }
            function weekHtml(){
                const weeks = weeksOf(schoolDates(local.config));
                if(!weeks.length) return '<div class="card section"><div class="empty">尚無日期</div></div>';
                if(ui.weekIdx>=weeks.length) ui.weekIdx=weeks.length-1;
                if(ui.weekIdx<0) ui.weekIdx=0;
                const week = weeks[ui.weekIdx];
                const todayStr = fmt(new Date());
                const cols = week.map(ds=>{
                    const subs = subjectsOnDate(local.config, ds);
                    const isHoliday = !!(local.holidays[ds]), isExam = !!(local.exams[ds]);
                    const isToday = ds === todayStr;
                    const body = subs.length ? subs.map(s=>{
                        const e = getEntry(local, ds, s.id);
                        return `<div class="subj-card" style="--c:${s.color};"><div class="sname">${esc(s.name)}</div>
                            <textarea data-field="progress" data-sid="${s.id}" data-date="${ds}" placeholder="（尚未填寫）">${esc(e.progress)}</textarea></div>`;
                    }).join('') : '<div class="day-empty">這天沒有排課</div>';
                    return `<div class="day-col" style="${isToday?'outline:2px solid var(--accent);':''}"><div class="day-head"><span class="d">${shortD(ds)}</span><span class="w">週${WD[wdOf(ds)]}${isHoliday?` · <span style="color:var(--holiday); font-weight:700;">${esc(local.holidays[ds])}</span>`:''}${isExam?` · <span style="color:var(--exam); font-weight:700;">${esc(formatExamLabel(local.exams[ds]))}</span>`:''}</span></div><div class="day-body">${body}</div></div>`;
                }).join('');
                return `<div class="card section">
                    <div class="week-nav">
                        <button class="icon-btn" id="wk-prev" ${ui.weekIdx<=0?'disabled':''}>← 上一週</button>
                        <div class="week-range"><span class="wk-num">第${ui.weekIdx+1}週</span><span class="wk-dates">${shortD(week[0])} – ${shortD(week[week.length-1])}</span></div>
                        <button class="icon-btn" id="wk-next" ${ui.weekIdx>=weeks.length-1?'disabled':''}>下一週 →</button>
                    </div>
                    <div class="week-sync-row"><span class="saved-flag">已同步</span></div>
                    <div class="week-grid">${cols}</div>
                </div>`;
            }
            function homeworkHtml(){
                const todayStr = fmt(new Date());
                const dates = schoolDates(local.config).filter(ds=>ds >= todayStr);
                const blocks = dates.map(ds=>{
                    const subs = subjectsForHomework(local.config, ds).map(s=>({s,e:getEntry(local,ds,s.id)})).filter(x=>x.e.homework && x.e.homework.trim());
                    if(ui.hwOnlyFilled && !subs.length) return '';
                    const isHoliday = !!(local.holidays[ds]), isExam = !!(local.exams[ds]); const d = parseD(ds);
                    return `<div class="card hw-day" data-date="${ds}">
                        <div class="hw-day-head">
                            <div class="d">${(d.getMonth()+1)}/${d.getDate()}（${WD[wdOf(ds)]}）${isHoliday?` <span class="stamp">${esc(formatHolidayLabel(local.holidays[ds]))}</span>`:''}${isExam?` <span class="stamp exam">${esc(formatExamLabel(local.exams[ds]))}</span>`:''}</div>
                            <button class="btn small outline" data-copy="${ds}" ${subs.length?'':'disabled'}>複製今日作業</button>
                        </div>
                        ${subs.length ? `<ul class="hw-list">${subs.map(x=>`<li><b>${esc(x.s.name)}：</b>${esc(x.e.homework)}</li>`).join('')}</ul>` : '<p class="hint">（無作業）</p>'}
                    </div>`;
                }).join('');
                return `<div class="toggle-row"><label><input type="checkbox" id="hw-filter" ${ui.hwOnlyFilled?'checked':''}> 只顯示有作業的日期</label><span class="saved-flag">已複製</span></div>
                    ${blocks || '<p class="hint">目前沒有符合條件的日期。</p>'}`;
            }
            function settingsHtml(){
                const holidayRows = Object.keys(local.holidays).sort().map(ds=>`
                    <div class="holiday-item"><span>${shortD(ds)}（${WD[wdOf(ds)]}）</span><span class="lbl">${esc(local.holidays[ds])}</span><button class="icon-btn" data-del-holiday="${ds}">✕</button></div>
                `).join('') || '<p class="hint">尚未標記任何假日。</p>';
                const examRows = Object.keys(local.exams).sort().map(ds=>`
                    <div class="holiday-item"><span>${shortD(ds)}（${WD[wdOf(ds)]}）</span><span class="lbl" style="color:var(--exam); font-weight:700;">${esc(local.exams[ds])}</span><button class="icon-btn" data-del-exam="${ds}">✕</button></div>
                `).join('') || '<p class="hint">尚未標記任何考試日。</p>';
                return `<div class="card section form-card">
                    <h2 style="font-size:var(--fs-h2); margin-bottom:10px;">學期與科目</h2>
                    ${configFormHtml(local.config)}
                    <div class="row" style="margin-top:14px;"><button class="btn" id="save-config">儲存設定</button></div>
                </div>
                <div class="card section form-card">
                    <h2 style="font-size:var(--fs-h2); margin-bottom:6px;">標記假日</h2>
                    <div class="row" style="margin-top:10px;"><div class="date-name-row"><input type="date" id="hol-date"><input type="text" id="hol-label" placeholder="例：教師節補假"></div><button class="btn small" id="hol-apply">套用</button></div>
                    <div class="holiday-list">${holidayRows}</div>
                </div>
                <div class="card section form-card">
                    <h2 style="font-size:var(--fs-h2); margin-bottom:6px;">標記考試日</h2>
                    <div class="row" style="margin-top:10px;"><div class="date-name-row"><input type="date" id="exam-date"><input type="text" id="exam-label" placeholder="例：期中考"></div><button class="btn small" id="exam-apply">套用</button></div>
                    <div class="holiday-list">${examRows}</div>
                </div>
                <div class="card section form-card">
                    <h2 style="font-size:var(--fs-h2); margin-bottom:10px;">備份與重設</h2>
                    <div class="row">
                        <button class="btn outline small" id="export-btn">匯出備份 (JSON)</button>
                        <label class="btn outline small" style="cursor:pointer;">匯入備份 (JSON)<input type="file" id="import-file" accept="application/json" style="display:none;"></label>
                        <button class="btn danger small" id="reset-btn">清除所有資料重新開始</button>
                    </div>
                </div>`;
            }

            function autoGrow(ta){ ta.style.height='auto'; ta.style.height=(ta.scrollHeight)+'px'; }
            function bindApp(){
                document.querySelectorAll('nav.tabs button').forEach(b=> b.onclick = ()=>{ 
                    ui.tab=b.dataset.tab; 
                    if(ui.tab === 'week' && local.config) {
                        ui.weekIdx = getCurrentWeekIdx(local.config);
                    }
                    renderApp(); 
                });
                if(ui.tab==='progress') bindProgress();
                if(ui.tab==='week') bindWeek();
                if(ui.tab==='homework') bindHomework();
                if(ui.tab==='settings') bindSettings();
            }
            function bindProgress(){
                document.querySelectorAll('.chip').forEach(c=> c.onclick = ()=>{ ui.subjectId=c.dataset.subj; renderApp(); });
                document.querySelectorAll('#tab-body textarea[data-field]').forEach(ta=>{ autoGrow(ta); ta.oninput=()=>{ autoGrow(ta); setEntry(ta.dataset.date, ta.dataset.sid, ta.dataset.field, ta.value); flashSaved(); }; });
            }
            function bindWeek(){
                const weeks = weeksOf(schoolDates(local.config));
                const prev=document.getElementById('wk-prev'), next=document.getElementById('wk-next');
                if(prev) prev.onclick = ()=>{ ui.weekIdx=Math.max(0,ui.weekIdx-1); renderApp(); };
                if(next) next.onclick = ()=>{ ui.weekIdx=Math.min(weeks.length-1,ui.weekIdx+1); renderApp(); };
                document.querySelectorAll('#tab-body textarea[data-field]').forEach(ta=>{ autoGrow(ta); ta.oninput=()=>{ autoGrow(ta); setEntry(ta.dataset.date, ta.dataset.sid, ta.dataset.field, ta.value); flashSaved(); }; });
            }
            function bindHomework(){
                const filter = document.getElementById('hw-filter');
                if(filter) filter.onchange = ()=>{ ui.hwOnlyFilled=filter.checked; renderApp(); };
                document.querySelectorAll('[data-copy]').forEach(btn=>{
                    btn.onclick = async ()=>{
                        const ds = btn.dataset.copy;
                        const subs = subjectsForHomework(local.config, ds).map(s=>({s,e:getEntry(local,ds,s.id)})).filter(x=>x.e.homework && x.e.homework.trim());
                        const d = parseD(ds);
                        let text = (d.getMonth()+1)+'/'+d.getDate()+'（'+WD[wdOf(ds)]+'）作業\n' + subs.map(x=>x.s.name+'：'+x.e.homework).join('\n');
                        try{ await navigator.clipboard.writeText(text); }
                        catch(e){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
                        flashSaved();
                    };
                });
            }
            function bindSettings(){
                const editor = document.getElementById('subj-editor');
                let subjects = local.config.subjects.map(s=>({...s, weekdays:[...s.weekdays]}));
                wireSubjEditor(editor, subjects);
                document.getElementById('add-subj').onclick = ()=>{ subjects.push(mkSubject('新科目',[])); renderSubjList(editor, subjects); };
                document.getElementById('save-config').onclick = ()=>{
                    const termName = document.getElementById('f-term').value.trim();
                    const start = document.getElementById('f-start').value, end = document.getElementById('f-end').value;
                    if(!start || !end){ window.showAlert('請填開學日與結業日'); return; }
                    const cleaned = subjects.filter(s=>s.name.trim() && s.weekdays.length);
                    if(!cleaned.length){ window.showAlert('至少需要一個有名稱、有勾選星期的科目'); return; }
                    local.config = { termName, start, end, subjects: cleaned };
                    if(!cleaned.find(s=>s.id===ui.subjectId)) ui.subjectId = cleaned[0].id;
                    ui.weekIdx = getCurrentWeekIdx(cleaned);
                    saveData(local); renderApp();
                };
                document.getElementById('hol-apply').onclick = ()=>{
                    const ds = document.getElementById('hol-date').value, label = document.getElementById('hol-label').value.trim();
                    if(!ds || !label){ window.showAlert('請選日期並輸入假日名稱'); return; }
                    local.holidays[ds] = label;
                    subjectsOnDate(local.config, ds).forEach(s=> setEntry(ds, s.id, 'progress', label));
                    saveData(local); renderApp();
                };
                document.querySelectorAll('[data-del-holiday]').forEach(btn=> btn.onclick = ()=>{ delete local.holidays[btn.dataset.delHoliday]; saveData(local); renderApp(); });
                document.getElementById('exam-apply').onclick = ()=>{
                    const ds = document.getElementById('exam-date').value, label = document.getElementById('exam-label').value.trim();
                    if(!ds || !label){ window.showAlert('請選日期並輸入考試名稱'); return; }
                    local.exams[ds] = label;
                    saveData(local); renderApp();
                };
                document.querySelectorAll('[data-del-exam]').forEach(btn=> btn.onclick = ()=>{ delete local.exams[btn.dataset.delExam]; saveData(local); renderApp(); });
                document.getElementById('export-btn').onclick = ()=>{
                    const blob = new Blob([JSON.stringify(local, null, 2)], {type:'application/json'});
                    const url = URL.createObjectURL(blob); const a = document.createElement('a');
                    a.href = url; a.download = (local.config.termName||'班級進度手帳')+'-備份.json'; a.click(); URL.revokeObjectURL(url);
                };
                document.getElementById('import-file').onchange = (e)=>{
                    const file = e.target.files[0]; if(!file) return;
                    const reader = new FileReader();
                    reader.onload = ()=>{
                        try{
                            const parsed = JSON.parse(reader.result);
                            if(!parsed.config) throw new Error('格式不正確');
                            local.config = parsed.config; local.entries = parsed.entries||{}; local.holidays = parsed.holidays||{}; local.exams = parsed.exams||{};
                            ui = { tab:'progress', subjectId: local.config.subjects[0] && local.config.subjects[0].id, weekIdx:getCurrentWeekIdx(local.config), hwOnlyFilled:true };
                            saveData(local); renderApp();
                        }catch(err){ window.showAlert('匯入失敗：檔案格式不正確'); }
                    };
                    reader.readAsText(file);
                };
                document.getElementById('reset-btn').onclick = ()=>{
                    if(!confirm('確定要清除所有資料嗎？此動作無法復原。')) return;
                    local.config = null; local.entries = {}; local.holidays = {}; local.exams = {};
                    ui = { tab:'progress', subjectId:null, weekIdx: getCurrentWeekIdx({start:'2026-01-01', end:'2026-12-31'}), hwOnlyFilled:true };
                    saveData(local); renderApp();
                };
            }

            renderApp();
        }
    </script>
</body>
</html>
